        }
        html {

        }
        body {

            transition: background 0.4s ease, color 0.4s ease;
        }

        /* Dark mode */
        body.dark-mode {
            background: #0f172a;
            color: #f1f5f9;
        }
        body.dark-mode .bg-white {

        }
        body.dark-mode .bg-slate-50 {
            background: #0f172a !important;
        }
        body.dark-mode .text-slate-800 {
            color: #f1f5f9 !important;
        }
        body.dark-mode .text-slate-600 {
            color: #cbd5e1 !important;
        }
        body.dark-mode .text-slate-500 {
            color: #94a3b8 !important;
        }
        body.dark-mode .border-slate-200 {
            border-color: #334155 !important;
        }
        body.dark-mode .border-slate-100 {
            border-color: #334155 !important;
        }
        body.dark-mode .bg-slate-100 {
            background: #334155 !important;
        }
        body.dark-mode .bg-slate-200 {

        }
        body.dark-mode .feature-card {

            border-color: #334155 !important;
        }
        body.dark-mode .pricing-card {

            border-color: #334155 !important;
        }
        body.dark-mode .testimonial-card {
            background: #1e293b !important;
            border-color: #334155 !important;
        }
        body.dark-mode .faq-item {
            border-color: #334155 !important;
        }
        body.dark-mode .faq-question {
            color: #f1f5f9 !important;
        }
        body.dark-mode .faq-answer {
            color: #cbd5e1 !important;
        }
        body.dark-mode .navbar-scrolled {
            background: rgba(15, 23, 42, 0.92) !important;
        }
        body.dark-mode .mobile-menu-inner {
            background: #1e293b !important;
            border-color: #334155 !important;
        }
        body.dark-mode .mobile-menu-inner button {
            color: #f1f5f9 !important;
        }
        body.dark-mode .mobile-menu-inner button:hover {
            background: #334155 !important;
        }
        body.dark-mode .dashboard-preview {
            background: #1e293b !important;
            border-color: #334155 !important;
        }
        body.dark-mode .dashboard-card {
            background: #0f172a !important;
            border-color: #334155 !important;
        }
        body.dark-mode .ai-chat-area {
            background: #0f172a !important;
            border-color: #334155 !important;
        }
        body.dark-mode .ai-chat-bubble-user {
            background: #6366f1 !important;
            color: white !important;
        }
        body.dark-mode .ai-chat-bubble-ai {
            background: #334155 !important;
            color: #f1f5f9 !important;
        }
        body.dark-mode .logo-cloud-bg {
            background: #0f172a !important;
            border-color: #334155 !important;
        }
        body.dark-mode .cta-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%) !important;
        }
        body.dark-mode .footer {
            background: #0f172a !important;
        }
        body.dark-mode .footer .border-slate-800 {
            border-color: #334155 !important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 8px;
        }
        body.dark-mode ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        /* Navbar transition */
        .navbar-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .navbar-scrolled {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
        }
        body.dark-mode .navbar-scrolled {
            background: rgba(15, 23, 42, 0.92) !important;
        }

        /* Feature card hover */
        .feature-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f1f5f9;
        }
        .feature-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.12);
            border-color: #e0e7ff;
        }

        /* Pricing card */
        .pricing-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f1f5f9;
        }
        .pricing-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }
        .pricing-card.popular {
            border-color: #6366f1;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.18);
            position: relative;
        }
        .pricing-card.popular::before {
            content: '⭐ Most Popular';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #6366f1;
            color: white;
            padding: 4px 20px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* Toggle switch */
        .toggle-switch {
            position: relative;
            width: 52px;
            height: 28px;
            background: #e2e8f0;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.3s ease;
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: #6366f1;
        }
        .toggle-switch .toggle-knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .toggle-switch.active .toggle-knob {
            transform: translateX(24px);
        }

        /* FAQ accordion */
        .faq-item {
            border-bottom: 1px solid #f1f5f9;
            overflow: hidden;
        }
        .faq-item:last-child {
            border-bottom: none;
        }
        .faq-question {
            cursor: pointer;
            padding: 18px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: transparent;
            border: none;
            text-align: left;
            font-weight: 600;
            color: #0f172a;
            transition: color 0.2s;
            gap: 16px;
        }
        .faq-question:hover {
            color: #6366f1;
        }
        .faq-question .faq-icon {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .faq-question.open .faq-icon {
            transform: rotate(180deg);
            color: #6366f1;
        }
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, padding 0.3s ease;
            opacity: 0;
            padding: 0 0 0 0;
            color: #475569;
            line-height: 1.7;
        }
        .faq-answer.open {
            max-height: 300px;
            opacity: 1;
            padding: 0 0 20px 0;
        }

        /* Logo cloud grayscale hover */
        .logo-item {
            filter: grayscale(1) brightness(0.6);
            transition: all 0.3s ease;
            opacity: 0.6;
            cursor: default;
        }
        .logo-item:hover {
            filter: grayscale(0) brightness(1);
            opacity: 1;
        }

        /* Hero mockup shadow */
        .mockup-shadow {
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.12);
        }

        /* Trust badge pulse */
        .trust-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* CTA section gradient */
        .cta-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        /* Footer */
        .footer {
            background: #0f172a;
            color: #cbd5e1;
        }
        .footer a {
            color: #94a3b8;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: white;
        }

        /* Animations */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.7s ease forwards;
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-100 {
            animation-delay: 0.1s;
        }
        .delay-200 {
            animation-delay: 0.2s;
        }
        .delay-300 {
            animation-delay: 0.3s;
        }
        .delay-400 {
            animation-delay: 0.4s;
        }
        .delay-500 {
            animation-delay: 0.5s;
        }

        /* Floating cards */
        .float-card {
            animation: float 6s ease-in-out infinite;
        }
        .float-card:nth-child(2) {
            animation-delay: 2s;
        }
        .float-card:nth-child(3) {
            animation-delay: 4s;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(1deg);
            }
        }

        /* Parallax container */
        .parallax-container {
            perspective: 1000px;
        }
        .parallax-card {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* Dashboard preview */
        .dashboard-preview {
            background: #f8fafc;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .dashboard-card {
            background: white;
            border-radius: 14px;
            border: 1px solid #f1f5f9;
            padding: 16px;
            transition: all 0.3s ease;
        }
        .dashboard-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        /* Chart bars */
        .chart-bar {
            transition: height 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            height: 0;
        }
        .chart-bar.animate {
            height: var(--height);
        }

        /* Counter */
        .counter-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #6366f1;
        }
        body.dark-mode .counter-value {
            color: #818cf8;
        }

        /* AI Chat */
        .ai-chat-area {
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .ai-chat-bubble-user {
            background: #6366f1;
            color: white;
            border-radius: 16px 16px 4px 16px;
            padding: 10px 16px;
            max-width: 80%;
            align-self: flex-end;
        }
        .ai-chat-bubble-ai {
            background: white;
            color: #0f172a;
            border-radius: 16px 16px 16px 4px;
            padding: 10px 16px;
            max-width: 80%;
            align-self: flex-start;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        body.dark-mode .ai-chat-bubble-ai {
            background: #1e293b;
            color: #f1f5f9;
            border-color: #334155;
        }

        /* Typing indicator */
        .typing-dots span {
            animation: typingDot 1.4s infinite both;
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
            margin: 0 2px;
        }
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingDot {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Dark mode toggle button */
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #f1f5f9;
        }
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        body.dark-mode .theme-toggle {
            color: #f1f5f9;
        }
        .theme-toggle.light {
            color: #0f172a;
        }
        body.dark-mode .theme-toggle.light {
            color: #f1f5f9;
        }
        .theme-toggle.light:hover {
            background: rgba(0, 0, 0, 0.06);
        }
        body.dark-mode .theme-toggle.light:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-mockup {
                margin-top: 2rem;
            }
            .pricing-card.popular {
                margin-top: 1.5rem;
            }
            .pricing-card.popular::before {
                top: -12px;
                font-size: 0.6rem;
                padding: 3px 14px;
            }
            .counter-value {
                font-size: 1.8rem;
            }
        }

        /* Logo SVG styling */
        .logo-svg {
            width: 40px;
            height: 40px;
        }
        .logo-svg .bg-grad {
            fill: url(#logoGrad);
        }
        .logo-svg .fg-grad {
            fill: url(#logoFg);
        }

        /* Notification dot pulse */
        .notif-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.6;
            }
        }

        /* Activity feed */
        .activity-item {
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        body.dark-mode .activity-item {
            border-color: #334155;
        }
        .activity-item .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.7rem;
            color: white;
            flex-shrink: 0;
        }

        /* Scroll-based navbar */
        .navbar-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

                                    // --- AI Demo Section ---

                                            if (!input.trim()) return;

                                            setInput('');
                                            setIsTyping(true);

                                            setTimeout(() => {
                                                const lower = userMsg.toLowerCase();
                                                let reply = DEFAULT_AI_RESPONSE;
                                                for (const [key, value] of Object.entries(AI_RESPONSES)) {
                                                    if (lower.includes(key)) {
                                                        reply = value;
                                                        break;
                                                    }
                                                }
                                                setMessages(prev => [...prev, { from: 'ai', text: reply }]);
                                                setIsTyping(false);

                                            p className = { `mt-3 text-lg ${isDark ? 'text-slate-400' : 'text-slate-500'}` } >

                                            /div>

                                            <
                                            div className = "flex items-center gap-2" >
                                            <
                                            div className = "w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-sm font-bold" >

                                            /div> <
                                            div >

                                            p className = { `text-sm font-semibold ${isDark ? 'text-white' : 'text-slate-800'}` } >

                                            /p> <
                                            p className = { `text-xs ${isDark ? 'text-slate-400' : 'text-slate-400'}` } >
                                            Online · Ready to help <
                                            /p> <
                                            /div> <
                                            /div> <
                                            div className = "flex items-center gap-1" >
                                            <
                                            span className = "w-2 h-2 rounded-full bg-emerald-500" > < /span> <
                                            span className = { `text-xs ${isDark ? 'text-slate-400' : 'text-slate-400'}` } >
                                            Active <
                                            /span> <
                                            /div> <
                                            /div>

                                            <
                                            div className = "h-64 overflow-y-auto p-4 space-y-3" >

                                                messages.map((msg, idx) => ( <
                                                    div key = { idx }
                                                    className = { `flex ${msg.from === 'user' ? 'justify-end' : 'justify-start'}` } >
                                                    <
                                                    div className = { msg.from === 'user' ? 'ai-chat-bubble-user' :

                                                    < /div> <
                                                    /div>
                                                ))
                                            } {
                                                isTyping && ( <
                                                    div className = "flex justify-start" >
                                                    <
                                                    div className = "ai-chat-bubble-ai" >
                                                    <
                                                    div className = "typing-dots flex gap-1" >
                                                    <
                                                    span > < /span> <
                                                    span > < /span> <
                                                    span > < /span> <
                                                    /div> <
                                                    /div> <
                                                    /div>
                                                )
                                            } <
                                            div ref = { chatEndRef } > < /div> <
                                            /div>

                                            <
                                            div className = "p-4 border-t border-slate-200 dark:border-slate-700" >
                                            <
                                            div className = "flex flex-wrap gap-1.5 mb-3" > {
                                                quickQuestions.map((q, i) => ( <
                                                    button key = { i }

                                                        () => { setInput(q);
                                                            setTimeout(handleSend, 100); } }

                                                                'bg-slate-700 text-slate-300 hover:bg-slate-600' :

                                                    /button>
                                                ))
                                            } <
                                            /div> <
                                            div className = "flex gap-2" >
                                            <
                                            input type = "text"
                                            value = { input }
                                            onChange = {
                                                (e) => setInput(e.target.value) }
                                            onKeyDown = {
                                                (e) => e.key === 'Enter' && handleSend() }
                                            placeholder = "Ask about sales, revenue, tasks..."
                                            className = { `flex-1 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition ${isDark ?
                                                        'bg-slate-700 text-white border-slate-600 placeholder-slate-400' :
                                                        'bg-white text-slate-800 border-slate-200 placeholder-slate-400'

                                            button onClick = { handleSend }
                                            className = "bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition shadow-md shadow-indigo-200 dark:shadow-indigo-900/30 flex items-center gap-2" >
                                            <
                                            i className = "fas fa-paper-plane" > < /i> Send <
                                            /button> <
                                            /div> <
                                            /div> <
                                            /div> <
                                            /div> <
                                            /section>
                                        );
                                    }

                                    // --- CTA Section ---
                                    function CTASection({ isDark }) {
                                        return ( <
                                            section className = { `cta-gradient py-20 ${isDark ? '' : ''}` } >
                                            <
                                            div className = "max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center" >

                                            Ready to bring order to your projects ? <

                                            div className = "flex flex-wrap justify-center gap-4 mt-8" >

                                            <
                                            i className = "fas fa-rocket" > < /i> Start Your Free Trial <
                                            /button> <
                                            button className = "bg-white/10 text-white px-8 py-4 rounded-full font-medium hover:bg-white/20 transition border border-white/20 backdrop-blur-sm flex items-center gap-2 text-lg" >
                                            <
                                            i className = "fas fa-phone" > < /i> Contact Sales <
                                            /button> <
                                            /div> <
                                            p className = "text-slate-400 text-sm mt-5" >
                                            <
                                            i className = "fas fa-check-circle text-indigo-400 mr-1.5" > < /i>
                                            No credit card required · 14 - day free trial · Cancel anytime <
                                            /p> <
                                            /div> <
                                            /section>

                                    }

                                    function Footer({ isDark }) {
                                        return ( <
                                            footer className = { `footer ${isDark ? 'bg-slate-900' : 'bg-slate-900'}` } >
                                            <
                                            div className = "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16" >
                                            <
                                            div className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-12" >
                                            <
                                            div className = "lg:col-span-2" >
                                            <
                                            div className = "flex items-center gap-2.5 mb-4" >
                                            <
                                            Logo / >
                                            <
                                            span className = "text-xl font-extrabold text-white tracking-tight" >
                                            Flow < span className = "text-indigo-400" > Stack < /span> <
                                            /span> <
                                            /div> <
                                            p className = "text-slate-400 text-sm leading-relaxed max-w-sm" >
                                            The project management tool that actually makes work feel good.
                                            Built for teams who want to ship faster without the chaos. <
                                            /p> <
                                            div className = "flex gap-3 mt-4" >
                                            <
                                            a href = "#"
                                            className = "w-9 h-9 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-indigo-600 transition" >
                                            <
                                            i className = "fab fa-twitter" > < /i> <
                                            /a> <
                                            a href = "#"
                                            className = "w-9 h-9 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-indigo-600 transition" >
                                            <
                                            i className = "fab fa-linkedin-in" > < /i> <
                                            /a> <
                                            a href = "#"
                                            className = "w-9 h-9 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-indigo-600 transition" >
                                            <
                                            i className = "fab fa-github" > < /i> <
                                            /a> <
                                            a href = "#"
                                            className = "w-9 h-9 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-indigo-600 transition" >
                                            <
                                            i className = "fab fa-youtube" > < /i> <
                                            /a> <
                                            /div> <
                                            /div>

                                            <
                                            div >
                                            <
                                            h4 className = "text-white font-semibold mb-4 text-sm" > Product < /h4> <
                                            ul className = "space-y-2.5 text-sm" >
                                            <
                                            li > < a href = "#features"
                                            className = "hover:text-white transition" > Features < /a></li >
                                            <
                                            li > < a href = "#pricing"
                                            className = "hover:text-white transition" > Pricing < /a></li >
                                            <
                                            li > < a href = "#"
                                            className = "hover:text-white transition" > Integrations < /a></li >
                                            <
                                            li > < a href = "#"
                                            className = "hover:text-white transition" > Changelog < /a></li >
                                            <
                                            /ul> <
                                            /div>

                                            <
                                            div >
                                            <
                                            h4 className = "text-white font-semibold mb-4 text-sm" > Company < /h4> <
                                            ul className = "space-y-2.5 text-sm" >
                                            <
                                            li > < a href = "#"
                                            className = "hover:text-white transition" > About < /a></li >
                                            <
                                            li > < a href = "#"
                                            className = "hover:text-white transition" > Careers < /a></li >
                                            <

                                            className = "hover:text-white transition" > Blog < /a></li >
                                            <
                                            li > < a href = "#"
                                            className = "hover:text-white transition" > Contact < /a></li >
                                            <
                                            /ul> <
                                            /div>

                                            <
                                            div >
                                            <
                                            h4 className = "text-white font-semibold mb-4 text-sm" > Legal < /h4> <
                                            ul className = "space-y-2.5 text-sm" >
                                            <
                                            li > < a href = "#"
                                            className = "hover:text-white transition" > Privacy < /a></li >
                                            <
                                            li > < a href = "#"
                                            className = "hover:text-white transition" > Terms < /a></li >
                                            <
                                            li > < a href = "#"
                                            className = "hover:text-white transition" > Security < /a></li >
                                            <
                                            li > < a href = "#"
                                            className = "hover:text-white transition" > Cookies < /a></li >
                                            <
                                            /ul> <
                                            /div> <
                                            /div>

                                            <

                                            <

                                            className = "hover:text-white transition" > Privacy Policy < /a> <

                                            /div> <
                                            /div> <
                                            /div> <
                                            /footer>
                                        );
                                    }

                                    // ============================================================
                                    //  APP
                                    // ============================================================
                                    function App() {
                                        const [scrollY, setScrollY] = useState(0);
                                        const [isDark, setIsDark] = useState(false);

                                        useEffect(() => {
                                            const onScroll = () => setScrollY(window.scrollY);
                                            window.addEventListener('scroll', onScroll, { passive: true });
                                            return () => window.removeEventListener('scroll', onScroll);
                                        }, []);

                                        useEffect(() => {
                                            if (isDark) {
                                                document.body.classList.add('dark-mode');
                                            } else {
                                                document.body.classList.remove('dark-mode');
                                            }
                                        }, [isDark]);

                                        const toggleDark = () => setIsDark(!isDark);

                                        return ( <
                                            div className = "min-h-screen" >
                                            <
                                            Navbar scrollY = { scrollY }
                                            isDark = { isDark }
                                            toggleDark = { toggleDark }
                                            /> <
                                            Hero isDark = { isDark }
                                            /> <
                                            LogoCloud isDark = { isDark }
                                            /> <
                                            FeaturesSection isDark = { isDark }
                                            /> <
                                            HowItWorks isDark = { isDark }
                                            /> <
                                            PricingSection isDark = { isDark }
                                            /> <
                                            TestimonialsSection isDark = { isDark }
                                            /> { /* FIX: Added missing FAQSection */ } <
                                            FAQSection isDark = { isDark }
                                            /> <
                                            DashboardSection isDark = { isDark }
                                            /> <
                                            AIDemoSection isDark = { isDark }
                                            /> <
                                            CTASection isDark = { isDark }
                                            /> <
                                            Footer isDark = { isDark }
                                            /> <
                                            /div>
                                        );
                                    }

                                    // ============================================================
                                    //  RENDER
                                    // ============================================================
                                    const root = ReactDOM.createRoot(document.getElementById('root'));
                                    root.render( < App / > );
    </script>
